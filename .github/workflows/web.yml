name: Deploy Web App

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/web.yml'
      - 'src/**'
      - 'scripts/build-runtime-assets.mjs'
      - 'scripts/check-js-syntax.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Check web source syntax
        run: npm run check:js-syntax

      - name: Build web preview
        run: npm run web:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
