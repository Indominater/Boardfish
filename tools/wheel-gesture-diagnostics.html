<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boardfish Wheel Gesture Diagnostics</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #171717;
      background: #e7eaed;
    }
    #surface {
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      background:
        linear-gradient(rgba(0,0,0,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.08) 1px, transparent 1px),
        #e7eaed;
      background-size: 48px 48px;
    }
    #marker {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 140px;
      height: 140px;
      margin: -70px 0 0 -70px;
      border: 2px solid #111;
      background: rgba(255,255,255,0.72);
      display: grid;
      place-items: center;
      font-weight: 700;
      user-select: none;
      transform-origin: center;
      will-change: transform;
    }
    #panel {
      position: fixed;
      top: 16px;
      left: 16px;
      width: min(460px, calc(100vw - 32px));
      padding: 14px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.16);
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
      font-size: 13px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.2;
    }
    p { margin: 6px 0; line-height: 1.35; }
    button {
      height: 32px;
      padding: 0 10px;
      border: 1px solid rgba(0,0,0,0.2);
      background: #fff;
      color: #111;
      font: inherit;
      cursor: pointer;
    }
    button:active { background: #eee; }
    #buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    #stats {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 3px 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(0,0,0,0.12);
      font-variant-numeric: tabular-nums;
    }
    code {
      padding: 1px 4px;
      background: rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
  <div id="surface">
    <div id="marker">Boardfish</div>
  </div>
  <section id="panel">
    <h1>Boardfish Wheel Gesture Diagnostics</h1>
    <p>Open this in Chrome or Edge on the Windows machine. Do 10 seconds of diagonal two-finger panning, then 10 seconds of pinch zoom or Ctrl+wheel.</p>
    <p>The square should move/zoom using Boardfish-like input handling. Export the JSON when finished.</p>
    <div id="buttons">
      <button id="reset">Reset</button>
      <button id="export">Export JSON</button>
      <button id="copy">Copy JSON</button>
    </div>
    <div id="stats"></div>
  </section>
  <script>
    const surface = document.getElementById('surface');
    const marker = document.getElementById('marker');
    const statsEl = document.getElementById('stats');
    const startedAt = performance.now();
    const events = [];
    const frames = [];
    let panX = 0;
    let panY = 0;
    let zoom = 1;
    let pendingPanX = 0;
    let pendingPanY = 0;
    let pendingZoomFactor = 1;
    let raf = 0;
    let lastEventAt = 0;

    function round(n) {
      return Math.round(n * 1000) / 1000;
    }

    function applyTransform() {
      marker.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    }

    function scheduleFrame() {
      if (raf) return;
      const scheduledAt = performance.now();
      raf = requestAnimationFrame(() => {
        raf = 0;
        const panDx = pendingPanX;
        const panDy = pendingPanY;
        const zoomFactor = pendingZoomFactor;
        pendingPanX = 0;
        pendingPanY = 0;
        pendingZoomFactor = 1;
        panX -= panDx;
        panY -= panDy;
        zoom = Math.max(0.1, Math.min(10, zoom * zoomFactor));
        frames.push({
          t: round(performance.now() - startedAt),
          queueMs: round(performance.now() - scheduledAt),
          panDx: round(panDx),
          panDy: round(panDy),
          zoomFactor: round(zoomFactor),
          panX: round(panX),
          panY: round(panY),
          zoom: round(zoom),
        });
        applyTransform();
        updateStats();
      });
    }

    function wheelZoomFactor(deltaY) {
      return Math.abs(deltaY) < 30
        ? Math.pow(0.995, deltaY)
        : deltaY < 0 ? 1.1 : 1 / 1.1;
    }

    function summarize() {
      const gaps = [];
      let panEvents = 0;
      let zoomEvents = 0;
      let zeroishEvents = 0;
      let diagonalEvents = 0;
      let xOnlyEvents = 0;
      let yOnlyEvents = 0;
      let sumAbsX = 0;
      let sumAbsY = 0;
      let maxAbsX = 0;
      let maxAbsY = 0;
      for (let i = 0; i < events.length; i++) {
        const e = events[i];
        const ax = Math.abs(e.deltaX);
        const ay = Math.abs(e.deltaY);
        if (i > 0) gaps.push(e.dt);
        if (e.mode === 'zoom') zoomEvents++;
        else panEvents++;
        if (ax < 0.01 && ay < 0.01) zeroishEvents++;
        if (ax >= 0.01 && ay >= 0.01) diagonalEvents++;
        else if (ax >= 0.01) xOnlyEvents++;
        else if (ay >= 0.01) yOnlyEvents++;
        sumAbsX += ax;
        sumAbsY += ay;
        maxAbsX = Math.max(maxAbsX, ax);
        maxAbsY = Math.max(maxAbsY, ay);
      }
      const sortedGaps = gaps.slice().sort((a, b) => a - b);
      const pct = (p) => sortedGaps.length ? sortedGaps[Math.min(sortedGaps.length - 1, Math.floor(sortedGaps.length * p))] : 0;
      return {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        eventCount: events.length,
        frameCount: frames.length,
        panEvents,
        zoomEvents,
        zeroishEvents,
        diagonalEvents,
        xOnlyEvents,
        yOnlyEvents,
        avgAbsX: round(events.length ? sumAbsX / events.length : 0),
        avgAbsY: round(events.length ? sumAbsY / events.length : 0),
        maxAbsX: round(maxAbsX),
        maxAbsY: round(maxAbsY),
        p50GapMs: round(pct(0.5)),
        p90GapMs: round(pct(0.9)),
        p99GapMs: round(pct(0.99)),
        finalPanX: round(panX),
        finalPanY: round(panY),
        finalZoom: round(zoom),
      };
    }

    function payload() {
      return {
        capturedAt: new Date().toISOString(),
        summary: summarize(),
        events,
        frames,
      };
    }

    function updateStats() {
      const s = summarize();
      statsEl.innerHTML = Object.entries(s)
        .filter(([key]) => !['userAgent'].includes(key))
        .map(([key, value]) => `<div>${key}</div><div><code>${value}</code></div>`)
        .join('');
    }

    surface.addEventListener('wheel', (event) => {
      event.preventDefault();
      const now = performance.now();
      const dt = lastEventAt ? now - lastEventAt : 0;
      lastEventAt = now;
      const mode = event.ctrlKey || event.metaKey ? 'zoom' : 'pan';
      if (mode === 'zoom') {
        pendingZoomFactor *= wheelZoomFactor(event.deltaY);
      } else {
        pendingPanX += event.deltaX;
        pendingPanY += event.deltaY;
      }
      events.push({
        t: round(now - startedAt),
        dt: round(dt),
        mode,
        deltaX: round(event.deltaX),
        deltaY: round(event.deltaY),
        deltaZ: round(event.deltaZ),
        deltaMode: event.deltaMode,
        ctrlKey: event.ctrlKey,
        metaKey: event.metaKey,
        shiftKey: event.shiftKey,
        altKey: event.altKey,
        cancelable: event.cancelable,
        pointerX: Math.round(event.clientX),
        pointerY: Math.round(event.clientY),
      });
      if (events.length > 5000) events.shift();
      scheduleFrame();
      updateStats();
    }, { passive: false });

    document.getElementById('reset').addEventListener('click', () => {
      events.length = 0;
      frames.length = 0;
      panX = 0;
      panY = 0;
      zoom = 1;
      pendingPanX = 0;
      pendingPanY = 0;
      pendingZoomFactor = 1;
      lastEventAt = 0;
      applyTransform();
      updateStats();
    });

    document.getElementById('export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(payload(), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `boardfish-wheel-diagnostics-${Date.now()}.json`;
      link.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('copy').addEventListener('click', async () => {
      await navigator.clipboard.writeText(JSON.stringify(payload(), null, 2));
    });

    applyTransform();
    updateStats();
  </script>
</body>
</html>
