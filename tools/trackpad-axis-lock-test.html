<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boardfish Trackpad Axis Lock Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111;
      background: #e7eaed;
    }
    #surface {
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      background:
        radial-gradient(circle at center, rgba(0,0,0,0.14) 1px, transparent 2px),
        linear-gradient(rgba(0,0,0,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.08) 1px, transparent 1px),
        #e7eaed;
      background-size: 96px 96px, 48px 48px, 48px 48px;
      background-position: 0 0, 0 0, 0 0;
    }
    #target {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 160px;
      height: 160px;
      margin: -80px 0 0 -80px;
      border: 2px solid #111;
      background: rgba(255,255,255,0.78);
      display: grid;
      place-items: center;
      font-weight: 750;
      user-select: none;
      will-change: transform;
    }
    #trail {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #panel {
      position: fixed;
      top: 14px;
      left: 14px;
      width: min(520px, calc(100vw - 28px));
      max-height: calc(100vh - 28px);
      overflow: auto;
      padding: 14px;
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(0,0,0,0.16);
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
      font-size: 13px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.2;
    }
    #step {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid rgba(0,0,0,0.16);
      background: #f7f8f9;
      font-size: 15px;
      font-weight: 700;
    }
    #buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0;
    }
    button {
      height: 32px;
      padding: 0 10px;
      border: 1px solid rgba(0,0,0,0.22);
      background: #fff;
      color: #111;
      font: inherit;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    #stats {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) auto;
      gap: 3px 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(0,0,0,0.12);
      font-variant-numeric: tabular-nums;
    }
    #log {
      margin-top: 10px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      line-height: 1.35;
      color: #333;
    }
    code {
      padding: 1px 4px;
      background: rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
  <canvas id="trail"></canvas>
  <div id="surface">
    <div id="target">Boardfish</div>
  </div>
  <section id="panel">
    <h1>Trackpad Axis Lock Test</h1>
    <p>Use only the Windows trackpad. Click Start, perform the shown gesture until the timer ends, then continue to the next step.</p>
    <div id="step">Ready</div>
    <div id="buttons">
      <button id="start">Start Step</button>
      <button id="skip">Skip Step</button>
      <button id="reset">Reset All</button>
      <button id="export" disabled>Export JSON</button>
      <button id="copy" disabled>Copy JSON</button>
    </div>
    <div id="stats"></div>
    <div id="log"></div>
  </section>
  <script>
    const STEPS = [
      { id: 'vertical_down', label: 'Two-finger pan straight down', seconds: 5 },
      { id: 'horizontal_right', label: 'Two-finger pan straight right', seconds: 5 },
      { id: 'diag_shallow_right_down', label: 'Small-angle diagonal: mostly right, slightly down', seconds: 8 },
      { id: 'diag_shallow_down_right', label: 'Small-angle diagonal: mostly down, slightly right', seconds: 8 },
      { id: 'diag_45_down_right', label: '45-degree diagonal down-right', seconds: 8 },
      { id: 'circle_slow_clockwise', label: 'Slow clockwise circles', seconds: 10 },
      { id: 'circle_slow_counterclockwise', label: 'Slow counterclockwise circles', seconds: 10 },
      { id: 'circle_fast_small', label: 'Fast small circles', seconds: 10 },
      { id: 'pinch_zoom', label: 'Pinch zoom in and out', seconds: 10 },
    ];

    const surface = document.getElementById('surface');
    const target = document.getElementById('target');
    const trail = document.getElementById('trail');
    const ctx = trail.getContext('2d');
    const stepEl = document.getElementById('step');
    const statsEl = document.getElementById('stats');
    const logEl = document.getElementById('log');
    const startBtn = document.getElementById('start');
    const skipBtn = document.getElementById('skip');
    const resetBtn = document.getElementById('reset');
    const exportBtn = document.getElementById('export');
    const copyBtn = document.getElementById('copy');
    const startedAt = performance.now();
    const events = [];
    const stepResults = [];
    let stepIndex = 0;
    let activeStep = null;
    let stepStartedAt = 0;
    let timer = 0;
    let panX = 0;
    let panY = 0;
    let zoom = 1;
    let lastEventAt = 0;

    function round(n) {
      return Math.round(n * 1000) / 1000;
    }

    function resizeTrail() {
      trail.width = window.innerWidth * devicePixelRatio;
      trail.height = window.innerHeight * devicePixelRatio;
      trail.style.width = window.innerWidth + 'px';
      trail.style.height = window.innerHeight + 'px';
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    function applyTransform() {
      target.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      ctx.fillStyle = activeStep ? 'rgba(20, 110, 220, 0.22)' : 'rgba(0,0,0,0.08)';
      ctx.beginPath();
      ctx.arc(window.innerWidth / 2 + panX, window.innerHeight / 2 + panY, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function currentStepEvents(stepId) {
      return events.filter((event) => event.stepId === stepId);
    }

    function summarizeEvents(items) {
      let panEvents = 0;
      let zoomEvents = 0;
      let diagonal = 0;
      let xOnly = 0;
      let yOnly = 0;
      let zeroish = 0;
      let sumX = 0;
      let sumY = 0;
      let absX = 0;
      let absY = 0;
      let maxGap = 0;
      let gapsOver80 = 0;
      for (let i = 0; i < items.length; i++) {
        const event = items[i];
        const ax = Math.abs(event.deltaX);
        const ay = Math.abs(event.deltaY);
        if (event.mode === 'zoom') zoomEvents++;
        else panEvents++;
        if (ax < 0.01 && ay < 0.01) zeroish++;
        else if (ax >= 0.01 && ay >= 0.01) diagonal++;
        else if (ax >= 0.01) xOnly++;
        else if (ay >= 0.01) yOnly++;
        sumX += event.deltaX;
        sumY += event.deltaY;
        absX += ax;
        absY += ay;
        if (i > 0) {
          const gap = event.t - items[i - 1].t;
          maxGap = Math.max(maxGap, gap);
          if (gap > 80) gapsOver80++;
        }
      }
      return {
        eventCount: items.length,
        panEvents,
        zoomEvents,
        diagonal,
        xOnly,
        yOnly,
        zeroish,
        sumX: round(sumX),
        sumY: round(sumY),
        absX: round(absX),
        absY: round(absY),
        xShare: round((absX + absY) ? absX / (absX + absY) : 0),
        yShare: round((absX + absY) ? absY / (absX + absY) : 0),
        axisLockedShare: round(items.length ? (xOnly + yOnly) / items.length : 0),
        maxGapMs: round(maxGap),
        gapsOver80,
      };
    }

    function updatePanel() {
      const step = STEPS[stepIndex];
      if (!step) {
        stepEl.textContent = 'Done. Export the JSON.';
        startBtn.disabled = true;
        skipBtn.disabled = true;
        exportBtn.disabled = false;
        copyBtn.disabled = false;
      } else if (activeStep) {
        const remaining = Math.max(0, activeStep.seconds - (performance.now() - stepStartedAt) / 1000);
        stepEl.textContent = `${activeStep.label} - ${remaining.toFixed(1)}s`;
      } else {
        stepEl.textContent = `Step ${stepIndex + 1}/${STEPS.length}: ${step.label} (${step.seconds}s)`;
      }
      const overall = summarizeEvents(events);
      statsEl.innerHTML = Object.entries(overall)
        .map(([key, value]) => `<div>${key}</div><div><code>${value}</code></div>`)
        .join('');
      logEl.textContent = stepResults.map((result, i) => {
        const s = result.summary;
        return `${i + 1}. ${result.label}\n   events=${s.eventCount} diag=${s.diagonal} xOnly=${s.xOnly} yOnly=${s.yOnly} axisLocked=${s.axisLockedShare} maxGap=${s.maxGapMs}ms xShare=${s.xShare} yShare=${s.yShare}`;
      }).join('\n');
    }

    function finishStep(skipped = false) {
      if (!activeStep) return;
      clearInterval(timer);
      const items = currentStepEvents(activeStep.id);
      stepResults.push({
        id: activeStep.id,
        label: activeStep.label,
        skipped,
        startedAt: round(stepStartedAt - startedAt),
        endedAt: round(performance.now() - startedAt),
        summary: summarizeEvents(items),
      });
      activeStep = null;
      stepIndex++;
      updatePanel();
    }

    function startStep() {
      if (activeStep || !STEPS[stepIndex]) return;
      activeStep = STEPS[stepIndex];
      stepStartedAt = performance.now();
      lastEventAt = 0;
      timer = setInterval(() => {
        if ((performance.now() - stepStartedAt) / 1000 >= activeStep.seconds) finishStep(false);
        updatePanel();
      }, 100);
      updatePanel();
    }

    function wheelZoomFactor(deltaY) {
      return Math.abs(deltaY) < 30
        ? Math.pow(0.995, deltaY)
        : deltaY < 0 ? 1.1 : 1 / 1.1;
    }

    surface.addEventListener('wheel', (event) => {
      event.preventDefault();
      const now = performance.now();
      const mode = event.ctrlKey || event.metaKey ? 'zoom' : 'pan';
      if (mode === 'zoom') {
        zoom = Math.max(0.1, Math.min(10, zoom * wheelZoomFactor(event.deltaY)));
      } else {
        panX -= event.deltaX;
        panY -= event.deltaY;
      }
      events.push({
        t: round(now - startedAt),
        stepId: activeStep ? activeStep.id : 'outside_step',
        stepLabel: activeStep ? activeStep.label : 'Outside step',
        dt: round(lastEventAt ? now - lastEventAt : 0),
        mode,
        deltaX: round(event.deltaX),
        deltaY: round(event.deltaY),
        deltaZ: round(event.deltaZ),
        deltaMode: event.deltaMode,
        ctrlKey: event.ctrlKey,
        metaKey: event.metaKey,
        shiftKey: event.shiftKey,
        altKey: event.altKey,
        cancelable: event.cancelable,
      });
      lastEventAt = now;
      applyTransform();
      updatePanel();
    }, { passive: false });

    function payload() {
      return {
        capturedAt: new Date().toISOString(),
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        steps: STEPS,
        stepResults,
        overall: summarizeEvents(events),
        events,
      };
    }

    startBtn.addEventListener('click', startStep);
    skipBtn.addEventListener('click', () => finishStep(true));
    resetBtn.addEventListener('click', () => {
      clearInterval(timer);
      events.length = 0;
      stepResults.length = 0;
      stepIndex = 0;
      activeStep = null;
      panX = 0;
      panY = 0;
      zoom = 1;
      lastEventAt = 0;
      startBtn.disabled = false;
      skipBtn.disabled = false;
      exportBtn.disabled = true;
      copyBtn.disabled = true;
      resizeTrail();
      applyTransform();
      updatePanel();
    });
    exportBtn.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(payload(), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `boardfish-axis-lock-test-${Date.now()}.json`;
      link.click();
      URL.revokeObjectURL(url);
    });
    copyBtn.addEventListener('click', async () => {
      await navigator.clipboard.writeText(JSON.stringify(payload(), null, 2));
    });

    window.addEventListener('resize', resizeTrail);
    resizeTrail();
    applyTransform();
    updatePanel();
  </script>
</body>
</html>
