<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Boardfish</title>
  <!-- Pages deploy refresh: 2026-06-03. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1c1b22" />
  <link rel="icon" type="image/png" sizes="512x512" href="boardfish-icon.png" />
  <link rel="apple-touch-icon" href="boardfish-icon.png" />
  <link rel="preload" href="fonts/Geist.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">
  <div id="canvas">
    <canvas id="board-canvas"></canvas>
    <div id="multi-sel-overlay"></div>
    <div id="sel-overlay">
      <div class="s-handle" data-dir="nw"></div>
      <div class="s-handle" data-dir="ne"></div>
      <div class="s-handle" data-dir="sw"></div>
      <div class="s-handle" data-dir="se"></div>
      <div class="s-handle" data-dir="w"></div>
      <div class="s-handle" data-dir="e"></div>
    </div>
  </div>

  <div id="ctx-menu">
    <button class="ctx-item" id="btn-new"><span class="ctx-label">New Board</span><span class="ctx-shortcut" data-shortcut="new-board"></span></button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" id="btn-add-text"><span class="ctx-label">Add Text</span><span class="ctx-shortcut" data-shortcut="add-text"></span></button>
    <button class="ctx-item" id="btn-add-image"><span class="ctx-label">Add Images</span><span class="ctx-shortcut" data-shortcut="add-images"></span></button>
    <button class="ctx-item" id="btn-paste"><span class="ctx-label">Paste</span><span class="ctx-shortcut" data-shortcut="paste"></span></button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" id="btn-save"><span class="ctx-label">Save</span><span class="ctx-shortcut" data-shortcut="save"></span></button>
    <button class="ctx-item" id="btn-save-as"><span class="ctx-label">Save As</span><span class="ctx-shortcut" data-shortcut="save-as"></span></button>
    <button class="ctx-item" id="btn-open"><span class="ctx-label">Open</span><span class="ctx-shortcut" data-shortcut="open"></span></button>
  </div>

  <div id="ctx-actions">
    <button class="ctx-action-item ctx-action-icon ui-highlight-nudge" id="ctx-btn-dark-mode" type="button" aria-label="Dark Mode" title="Dark Mode" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M20.7 14.4A8.3 8.3 0 0 1 9.6 3.3a.8.8 0 0 0-.8-1.2A10.3 10.3 0 1 0 21.9 15.2a.8.8 0 0 0-1.2-.8ZM12 20.3A8.3 8.3 0 0 1 7.3 5.1a9.9 9.9 0 0 0 11.6 11.6A8.3 8.3 0 0 1 12 20.3Z" />
      </svg>
    </button>
    <div class="ctx-sep ctx-action-sep" aria-hidden="true"></div>
    <a class="ctx-action-item ctx-action-icon ui-highlight-nudge" id="ctx-btn-github" href="https://github.com/Indominater/Boardfish" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M8 0C3.58 0 0 3.67 0 8.19c0 3.62 2.29 6.69 5.47 7.77.4.08.55-.18.55-.4 0-.2-.01-.85-.01-1.54-2.01.38-2.53-.5-2.69-.96-.09-.23-.48-.96-.82-1.16-.28-.16-.68-.55-.01-.56.63-.01 1.08.59 1.23.84.72 1.24 1.87.89 2.33.68.07-.53.28-.89.51-1.09-1.78-.21-3.64-.91-3.64-4.04 0-.89.31-1.63.82-2.2-.08-.21-.36-1.04.08-2.17 0 0 .67-.22 2.2.84A7.4 7.4 0 0 1 8 3.92c.68 0 1.36.09 2 .28 1.53-1.06 2.2-.84 2.2-.84.44 1.13.16 1.96.08 2.17.51.57.82 1.3.82 2.2 0 3.14-1.87 3.83-3.65 4.04.29.26.54.76.54 1.54 0 1.11-.01 2-.01 2.27 0 .22.15.48.55.4A8.13 8.13 0 0 0 16 8.19C16 3.67 12.42 0 8 0Z" />
      </svg>
    </a>
  </div>

  <div id="obj-ctx-menu">
    <button class="ctx-item" id="obj-btn-copy"><span class="ctx-label">Copy</span><span class="ctx-shortcut" data-shortcut="copy"></span></button>
    <button class="ctx-item" id="obj-btn-duplicate"><span class="ctx-label">Duplicate</span><span class="ctx-shortcut" data-shortcut="duplicate"></span></button>
    <div class="ctx-sep" id="obj-sep-image-actions"></div>
    <button class="ctx-item" id="obj-btn-flip"><span class="ctx-label">Flip</span><span class="ctx-shortcut" data-shortcut="flip-image"></span></button>
    <button class="ctx-item" id="obj-btn-rotate"><span class="ctx-label">Rotate</span><span class="ctx-shortcut" data-shortcut="rotate-image"></span></button>
    <div class="ctx-sep" id="obj-sep-layer-actions"></div>
    <button class="ctx-item" id="obj-btn-move-to-back"><span class="ctx-label">Move to Back</span><span class="ctx-shortcut" data-shortcut="move-to-back"></span></button>
    <div class="ctx-sep" id="obj-sep-export"></div>
    <button class="ctx-item" id="obj-btn-save-image"><span class="ctx-label">Export Image</span><span class="ctx-shortcut" data-shortcut="export-image"></span></button>
    <button class="ctx-item" id="obj-btn-save-images"><span class="ctx-label">Export Images</span><span class="ctx-shortcut" data-shortcut="export-images"></span></button>
    <div class="ctx-sep" id="obj-sep-delete"></div>
    <button class="ctx-item" id="obj-btn-delete"><span class="ctx-label">Delete</span><span class="ctx-shortcut" data-shortcut="delete"></span></button>
  </div>

  <div id="text-ctx-menu">
    <button class="ctx-item" id="text-btn-copy"><span class="ctx-label">Copy</span><span class="ctx-shortcut" data-shortcut="copy"></span></button>
    <button class="ctx-item" id="text-btn-paste"><span class="ctx-label">Paste</span><span class="ctx-shortcut" data-shortcut="paste"></span></button>
    <div class="ctx-sep" id="text-sep-delete"></div>
    <button class="ctx-item" id="text-btn-delete"><span class="ctx-label">Delete</span><span class="ctx-shortcut" data-shortcut="delete"></span></button>
  </div>

  <input type="file" id="file-input" accept="image/png,image/jpeg" multiple />

  <div id="dialog-overlay">
    <div id="dialog">
      <div id="dialog-body">
        <div class="ctx-item" id="dialog-title">Save Changes?</div>
      </div>
      <div class="ctx-sep"></div>
      <div id="dialog-btns">
        <button class="ctx-item dialog-action" id="dlg-discard">Delete</button>
        <div id="dlg-right">
          <button class="ctx-item dialog-action" id="dlg-cancel">Cancel</button>
          <button class="ctx-item dialog-action" id="dlg-save">Save</button>
        </div>
      </div>
    </div>
  </div>


  <div id="rubber-band"></div>
  <div id="opening-shield"></div>

  <div id="island" aria-hidden="true">
    <span id="isl-zoom" class="ui-highlight-nudge"></span>
  </div>

  <script type="application/json" id="boardfish-board-contract">
{"format":"boardfish-container","versions":{"legacy":2,"container":3},"objectTypes":["image","text"],"viewport":{"minZoom":0.01,"maxZoom":100}}
  </script>
  <script type="module" src="js/main.web.dev.mjs"></script>
</body>
</html>
