<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boardfish</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=dark_mode" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="mac-titlebar" data-tauri-drag-region></div>

  <div id="canvas">
    <canvas id="board-canvas"></canvas>
    <div id="multi-sel-overlay"></div>
    <div id="sel-overlay">
      <div class="s-handle" data-dir="nw"></div>
      <div class="s-handle" data-dir="ne"></div>
      <div class="s-handle" data-dir="sw"></div>
      <div class="s-handle" data-dir="se"></div>
      <div class="s-handle" data-dir="w"></div>
      <div class="s-handle" data-dir="e"></div>
    </div>
  </div>

  <div id="ctx-menu">
    <button class="ctx-item" id="btn-new"><span class="ctx-label">New Board</span><span class="ctx-shortcut" data-shortcut="new-board"></span></button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" id="btn-add-text"><span class="ctx-label">Add Text</span><span class="ctx-shortcut" data-shortcut="add-text"></span></button>
    <button class="ctx-item" id="btn-add-image"><span class="ctx-label">Add Images</span><span class="ctx-shortcut" data-shortcut="add-images"></span></button>
    <button class="ctx-item" id="btn-paste"><span class="ctx-label">Paste</span><span class="ctx-shortcut" data-shortcut="paste"></span></button>
    <div class="ctx-sep" id="ctx-sep-reset-zoom"></div>
    <button class="ctx-item" id="btn-reset-zoom"><span class="ctx-label">Reset Zoom</span><span class="ctx-shortcut" data-shortcut="reset-zoom"></span></button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" id="btn-save"><span class="ctx-label">Save</span><span class="ctx-shortcut" data-shortcut="save"></span></button>
    <button class="ctx-item" id="btn-save-as"><span class="ctx-label">Save As</span><span class="ctx-shortcut" data-shortcut="save-as"></span></button>
    <button class="ctx-item" id="btn-open"><span class="ctx-label">Open</span><span class="ctx-shortcut" data-shortcut="open"></span></button>
    <div class="ctx-sep" id="ctx-sep-export-all"></div>
    <button class="ctx-item" id="btn-export-all-text"><span class="ctx-label">Export All Text</span></button>
    <button class="ctx-item" id="btn-export-all-images"><span class="ctx-label">Export All Images</span></button>
  </div>

  <div id="ctx-actions">
    <button class="ctx-action-item ctx-action-icon" id="ctx-btn-dark-mode" type="button" aria-label="Dark Mode" aria-pressed="false">
      <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
    </button>
  </div>

  <div id="obj-ctx-menu">
    <button class="ctx-item" id="obj-btn-copy"><span class="ctx-label">Copy</span><span class="ctx-shortcut" data-shortcut="copy"></span></button>
    <button class="ctx-item" id="obj-btn-duplicate"><span class="ctx-label">Duplicate</span><span class="ctx-shortcut" data-shortcut="duplicate"></span></button>
    <div class="ctx-sep" id="obj-sep-lock-before"></div>
    <button class="ctx-item" id="obj-btn-lock"><span class="ctx-label">Lock</span></button>
    <div class="ctx-sep" id="obj-sep-lock-after"></div>
    <div class="ctx-sep" id="obj-sep-image-actions"></div>
    <button class="ctx-item" id="obj-btn-flip-horizontal"><span class="ctx-label">Flip Horizontal</span></button>
    <button class="ctx-item" id="obj-btn-flip-vertical"><span class="ctx-label">Flip Vertical</span></button>
    <button class="ctx-item" id="obj-btn-rotate"><span class="ctx-label">Rotate</span></button>
    <div class="ctx-sep" id="obj-sep-layer-actions"></div>
    <button class="ctx-item" id="obj-btn-move-to-back"><span class="ctx-label">Move to Back</span><span class="ctx-shortcut" data-shortcut="move-to-back"></span></button>
    <div class="ctx-sep" id="obj-sep-export"></div>
    <button class="ctx-item" id="obj-btn-save-image"><span class="ctx-label">Export Image</span><span class="ctx-shortcut" data-shortcut="export-image"></span></button>
    <button class="ctx-item" id="obj-btn-save-images"><span class="ctx-label">Export Images</span><span class="ctx-shortcut" data-shortcut="export-images"></span></button>
    <div class="ctx-sep" id="obj-sep-delete"></div>
    <button class="ctx-item" id="obj-btn-delete"><span class="ctx-label">Delete</span><span class="ctx-shortcut" data-shortcut="delete"></span></button>
  </div>

  <input type="file" id="file-input" accept="image/png,image/jpeg" multiple />

  <div id="dialog-overlay">
    <div id="dialog">
      <div id="dialog-body">
        <div class="ctx-item" id="dialog-title">Save Changes?</div>
      </div>
      <div class="ctx-sep"></div>
      <div id="dialog-btns">
        <button class="ctx-item dialog-action" id="dlg-discard">Delete</button>
        <div id="dlg-right">
          <button class="ctx-item dialog-action" id="dlg-cancel">Cancel</button>
          <button class="ctx-item dialog-action" id="dlg-save">Save</button>
        </div>
      </div>
    </div>
  </div>


  <div id="rubber-band"></div>
  <div id="opening-shield"></div>

  <div id="island" aria-hidden="true">
    <span id="isl-zoom"></span>
  </div>
  <div id="eyedropper-loupe" class="eyedropper-loupe" aria-hidden="true">
    <div id="eyedropper-top" class="eyedropper-top">
      <div id="eyedropper-preview" class="eyedropper-preview">
        <canvas id="eyedropper-canvas" class="eyedropper-canvas"></canvas>
      </div>
    </div>
    <div id="eyedropper-values" class="eyedropper-values">
      <div class="ctx-item eyedropper-value-row eyedropper-hex-row">
        <span class="eyedropper-value-text"><span>HEX:</span> <span id="eyedropper-hex" class="eyedropper-hex">#000000</span></span>
      </div>
      <div class="ctx-item eyedropper-value-row">
        <span class="eyedropper-value-text"><span>RGB:</span> <span id="eyedropper-rgb" class="eyedropper-rgb">0 0 0</span></span>
      </div>
      <span id="eyedropper-swatch" class="eyedropper-swatch" aria-hidden="true"></span>
    </div>
  </div>

  <script type="application/json" id="boardfish-board-contract">
{"format":"boardfish-container","versions":{"legacy":2,"container":3},"objectTypes":["image","text"],"viewport":{"minZoom":0.1,"maxZoom":10}}
  </script>
  <script type="module" src="js/main.mjs"></script>
</body>
</html>
