<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boardfish</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="mac-titlebar" data-tauri-drag-region></div>

  <div id="canvas">
    <canvas id="board-canvas"></canvas>
    <div id="multi-sel-overlay"></div>
    <div id="sel-overlay">
      <div class="s-handle" data-dir="nw"></div>
      <div class="s-handle" data-dir="ne"></div>
      <div class="s-handle" data-dir="sw"></div>
      <div class="s-handle" data-dir="se"></div>
      <div class="s-handle" data-dir="w"></div>
      <div class="s-handle" data-dir="e"></div>
    </div>
  </div>

  <div id="ctx-menu">
    <button class="ctx-item" id="btn-new">New Board</button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" id="btn-add-text">Add Text</button>
    <button class="ctx-item" id="btn-add-image">Add Images</button>
    <button class="ctx-item" id="btn-paste">Paste</button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" id="btn-save">Save</button>
    <button class="ctx-item" id="btn-save-as">Save As</button>
    <button class="ctx-item" id="btn-open">Open</button>
    <div class="ctx-sep" id="ctx-sep-export-all"></div>
    <button class="ctx-item" id="btn-export-all-text">Export All Text</button>
    <button class="ctx-item" id="btn-export-all-images">Export All Images</button>
  </div>

  <div id="obj-ctx-menu">
    <button class="ctx-item" id="obj-btn-copy">Copy</button>
    <button class="ctx-item" id="obj-btn-duplicate">Duplicate</button>
    <div class="ctx-sep" id="obj-sep-image-actions"></div>
    <button class="ctx-item" id="obj-btn-flip-horizontal">Flip Horizontal</button>
    <button class="ctx-item" id="obj-btn-flip-vertical">Flip Vertical</button>
    <button class="ctx-item" id="obj-btn-rotate">Rotate</button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" id="obj-btn-move-to-back">Move to Back</button>
    <div class="ctx-sep" id="obj-sep-export"></div>
    <button class="ctx-item" id="obj-btn-save-image">Export Image</button>
    <button class="ctx-item" id="obj-btn-save-images">Export Images</button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" id="obj-btn-delete">Delete</button>
  </div>

  <input type="file" id="file-input" accept="image/png,image/jpeg" multiple />

  <div id="dialog-overlay">
    <div id="dialog">
      <div id="dialog-body">
        <div class="ctx-item" id="dialog-title">Save Changes?</div>
      </div>
      <div class="ctx-sep"></div>
      <div id="dialog-btns">
        <button class="ctx-item dialog-action" id="dlg-discard">Delete</button>
        <div id="dlg-right">
          <button class="ctx-item dialog-action" id="dlg-cancel">Cancel</button>
          <button class="ctx-item dialog-action" id="dlg-save">Save</button>
        </div>
      </div>
    </div>
  </div>


  <div id="rubber-band"></div>
  <div id="opening-shield"></div>

  <div id="island">
    <span id="isl-zoom">100%</span>
  </div>
  <span id="isl-measure" aria-hidden="true"></span>

  <script src="app.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/debug.js"></script>
  <script src="js/text_layout.js"></script>
  <script src="js/image_variants.js"></script>
  <script src="js/viewport.js"></script>
  <script src="js/state.js"></script>
  <script src="js/image_state.js"></script>
  <script src="js/history_state.js"></script>
  <script src="js/board_schema.js"></script>
  <script src="js/selection_input.js"></script>
  <script src="js/text_editor.js"></script>
  <script src="js/object_commands.js"></script>
  <script src="js/canvas_input.js"></script>
  <script src="js/context_menu.js"></script>
  <script src="js/image_insert.js"></script>
  <script src="js/io_close.js"></script>
  <script src="js/window_recovery.js"></script>
  <script src="js/clipboard_export_init.js"></script>
  <script src="js/keyboard.js"></script>
</body>
</html>
